services:
  wake-relay:
    build:
      context: .
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    tmpfs:
      - /tmp:size=1m,mode=1777
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('WAKE_RELAY_PORT', '8787') + '/health', timeout=2).read()
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
