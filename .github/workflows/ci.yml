# Public-repo CI. Minimal, with no runtime or deployment secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Mobile tests
        # The attachment suite is order-sensitive when it shares a Jest process with
        # the full app suite. Run it in a fresh process while still covering every test.
        run: |
          cd packages/mobile
          bun run test -- --runInBand --forceExit --testPathIgnorePatterns=chat-attachments.test.tsx
          bun run test -- --runInBand --forceExit __tests__/chat-attachments.test.tsx
      - name: Expo bundle check
        run: cd packages/mobile && bunx expo export --platform ios

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # NOTE: gitleaks/gitleaks-action@v2 requires a PAID GITLEAKS_LICENSE for
      # organization-owned repos (volter-ai). The gitleaks CLI itself is free, so
      # run it directly with the shipped .gitleaks.toml — the SAME invocation the
      # private export gate uses, so public CI and the export scan agree.
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --no-git --source . --redact --config .gitleaks.toml
