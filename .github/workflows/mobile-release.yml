name: Mobile delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-release.yml'
      - 'bun.lock'
      - 'package.json'
      - 'patches-bun/**'
      - '.gitignore'
      - 'packages/mobile/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      channel:
        description: EAS channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      native_build:
        description: Build a new native binary instead of publishing an OTA update
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'preview' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Mobile tests
        working-directory: packages/mobile
        run: |
          bun run test -- --runInBand --forceExit --testPathIgnorePatterns=chat-attachments.test.tsx
          bun run test -- --runInBand --forceExit __tests__/chat-attachments.test.tsx
      - name: iOS bundle check
        working-directory: packages/mobile
        run: bunx expo export --platform ios

  classify:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.changes.outputs.native }}
      channel: ${{ steps.changes.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          FORCE_NATIVE: ${{ inputs.native_build }}
        run: |
          channel="${REQUESTED_CHANNEL:-preview}"
          native="${FORCE_NATIVE:-false}"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              native=true
            elif ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
              package.json \
              bun.lock \
              packages/mobile/package.json \
              packages/mobile/app.config.* \
              packages/mobile/app.json \
              packages/mobile/eas.json \
              packages/mobile/.gitignore \
              packages/mobile/babel.config.* \
              packages/mobile/metro.config.* \
              packages/mobile/plugins \
              packages/mobile/modules \
              packages/mobile/targets \
              packages/mobile/assets \
              patches-bun; then
              native=true
            fi
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  deliver:
    needs: [validate, classify]
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ needs.classify.outputs.channel }}
    env:
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY_DEV: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY_DEV }}
      EXPO_PUBLIC_GATEWAY_URL: ${{ vars.EXPO_PUBLIC_GATEWAY_URL }}
      EXPO_PUBLIC_GATEWAY_URL_DEV: ${{ vars.EXPO_PUBLIC_GATEWAY_URL_DEV }}
      EXPO_PUBLIC_GITHUB_APP_NAME: ${{ vars.EXPO_PUBLIC_GITHUB_APP_NAME }}
      EXPO_PUBLIC_GITHUB_APP_NAME_DEV: ${{ vars.EXPO_PUBLIC_GITHUB_APP_NAME_DEV }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.7.0
      - name: Check deployment configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EAS_UPDATE_PRIVATE_KEY: ${{ secrets.EAS_UPDATE_PRIVATE_KEY }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN is missing"; exit 1; }
          test -n "$SENTRY_AUTH_TOKEN" || { echo "::error::SENTRY_AUTH_TOKEN is missing"; exit 1; }
          test -n "$SENTRY_ORG" || { echo "::error::SENTRY_ORG is missing"; exit 1; }
          test -n "$SENTRY_PROJECT" || { echo "::error::SENTRY_PROJECT is missing"; exit 1; }
          test -n "$EXPO_PUBLIC_SENTRY_DSN" || { echo "::error::EXPO_PUBLIC_SENTRY_DSN is missing"; exit 1; }
          test -n "$EAS_UPDATE_PRIVATE_KEY" || { echo "::error::EAS_UPDATE_PRIVATE_KEY is missing"; exit 1; }
          test -n "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" || { echo "::error::EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY is missing"; exit 1; }
          test -n "$EXPO_PUBLIC_GATEWAY_URL" || { echo "::error::EXPO_PUBLIC_GATEWAY_URL is missing"; exit 1; }
          test -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" || { echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 is missing"; exit 1; }
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > packages/mobile/GoogleService-Info.plist
      - name: Publish OTA update
        if: needs.classify.outputs.native != 'true'
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_UPDATE_PRIVATE_KEY: ${{ secrets.EAS_UPDATE_PRIVATE_KEY }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/eas-update-private-key.pem"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$EAS_UPDATE_PRIVATE_KEY" > "$key_path"
          eas update \
            --channel "${{ needs.classify.outputs.channel }}" \
            --environment "${{ needs.classify.outputs.channel }}" \
            --message "${{ github.sha }}" \
            --platform ios \
            --private-key-path "$key_path" \
            --non-interactive
      - name: Upload OTA source maps to Sentry
        if: needs.classify.outputs.native != 'true'
        working-directory: packages/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bunx sentry-expo-upload-sourcemaps dist
      - name: Build native app
        if: needs.classify.outputs.native == 'true'
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas build
          --profile "${{ needs.classify.outputs.channel }}"
          --platform ios
          --non-interactive
